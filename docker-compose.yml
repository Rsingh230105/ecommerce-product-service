services:
  product-service:
    build: .
    networks:
      - default
      - ecommerce-network
    container_name: ecommerce-product-service
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER} 
      DB_PASSWORD: ${DB_PASSWORD} 
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME} 
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: ${DB_NAME} 
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

volumes:
  ecommerce_postgres_data:

networks:
  ecommerce-network:
    external: true

